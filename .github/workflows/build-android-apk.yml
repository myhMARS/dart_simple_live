name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (optional, e.g. v1.11.4-ci). Leave empty to only upload an artifact."
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "simple_live_app/**"
      - "simple_live_core/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Purge jsDelivr version cache
        run: |
          curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/myhMARS/dart_simple_live@master/assets/app_version.json" > /dev/null || true

      - name: Validate version manifest
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys

          pubspec = open('simple_live_app/pubspec.yaml', encoding='utf-8').read()
          match = re.search(r'^version:\s*([^\s]+)', pubspec, re.M)
          if not match:
              sys.exit('pubspec.yaml version not found')
          version, build = match.group(1).split('+')
          manifest = json.load(open('assets/app_version.json', encoding='utf-8'))
          if manifest.get('version') != version or int(manifest.get('version_num', -1)) != int(build):
              sys.exit(
                  'version mismatch: pubspec=%s+%s manifest=%s+%s'
                  % (version, build, manifest.get('version'), manifest.get('version_num'))
              )
          print('version ok: %s+%s' % (version, build))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          channel: stable
          cache: true

      - name: Restore CI signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ci-keystore.p12"
          keytool -list -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/ci-keystore.p12" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          cat > simple_live_app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/ci-keystore.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          EOF

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build release APK
        working-directory: simple_live_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          make_latest: true
